<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反射神経テスト｜ヒマツブ</title><style>
:root{--bg:#fffaf3;--card:#fff;--ink:#302b28;--muted:#746d67;--accent:#f0b54d;--soft:#f7e4bd;--line:#eee5da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 48px}.brand{text-align:center;font-weight:900;font-size:34px;letter-spacing:.05em}.tag{text-align:center;color:var(--muted);margin:5px 0 30px}
h1,h2,p{margin-top:0}.question{text-align:center;font-size:25px;font-weight:800;margin:20px 0 16px}
.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timebtn,.primary,.choice{border:0;border-radius:18px;background:#fff;box-shadow:0 5px 18px #0000000c;padding:19px;font-weight:800;font-size:18px;color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.timebtn strong{display:block;font-size:28px}.timebtn.active{background:var(--soft)}
.card{background:var(--card);border-radius:22px;padding:20px;margin-top:22px;box-shadow:0 5px 20px #0000000b}.eyebrow{font-size:13px;font-weight:800;color:#a46c18}.primary{display:block;width:100%;background:var(--accent);margin-top:14px}.small{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.back{text-decoration:none;color:var(--ink);font-weight:700}.pill{background:var(--soft);padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}
.center{text-align:center}.big{font-size:46px;font-weight:900;margin:24px 0}.choices{display:grid;gap:10px}.choice{border:2px solid transparent}.choice.correct{border-color:#70b77e;background:#eff9f1}.choice.wrong{border-color:#df7c74;background:#fff0ef}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.reaction-zone{height:330px;border-radius:26px;background:#e9e4dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;user-select:none;cursor:pointer;transition:.15s}.reaction-zone.ready{background:#cce7c8}.reaction-zone.tooearly{background:#f4d0cd}.reaction-zone strong{font-size:30px}
.resultnum{font-size:58px;font-weight:900;margin:15px 0 5px}.hidden{display:none!important}
</style></head><body><main class="wrap">
<div class="top"><a class="back" href="index.html">← ヒマツブ</a><span class="pill">1分ヒマ</span></div>
<div id="intro" class="center"><div class="eyebrow">1分でできる</div><h1>⚡ 反射神経テスト</h1><p>画面が変わった瞬間にタップ！<br>3回の平均タイムを測ります。</p><button class="primary" onclick="countdown()">スタート</button></div>
<div id="count" class="center hidden"><p class="small">まもなくスタート</p><div id="countnum" class="big">3</div></div>
<div id="game" class="hidden"><div class="progress"><div id="bar" class="bar"></div></div><p class="small center" style="margin-top:10px"><span id="round">1</span> / 3</p><div id="zone" class="reaction-zone"><div><strong id="zonetxt">待って…</strong><p id="zonesub">色が変わるまでタップしないでください</p></div></div></div>
<div id="result" class="center hidden"><div class="eyebrow">RESULT</div><h1>あなたの反応速度</h1><div class="resultnum"><span id="avg">0</span><small style="font-size:20px"> ms</small></div><p id="rank"></p><div class="card"><p id="detail"></p></div><button class="primary" onclick="resetAll()">もう一度</button><a class="primary" style="background:#fff" href="index.html">別のゲーム</a></div>
</main><script>
let state='idle', timer=null, start=0, n=1, scores=[];
const intro=document.getElementById('intro'), count=document.getElementById('count'), game=document.getElementById('game'), result=document.getElementById('result'), zone=document.getElementById('zone');
function countdown(){intro.classList.add('hidden');count.classList.remove('hidden');let x=3;countnum.textContent=x;let i=setInterval(()=>{x--; if(x>0) countnum.textContent=x; else{clearInterval(i);countnum.textContent='START!';setTimeout(()=>{count.classList.add('hidden');game.classList.remove('hidden');prepare();},550)}},650)}
function prepare(){state='waiting';zone.className='reaction-zone';zonetxt.textContent='待って…';zonesub.textContent='色が変わるまでタップしないでください';round.textContent=n;bar.style.width=((n-1)/3*100)+'%';clearTimeout(timer);timer=setTimeout(()=>{state='ready';zone.classList.add('ready');zonetxt.textContent='今！タップ！';zonesub.textContent='';start=performance.now();},1200+Math.random()*2500)}
zone.onclick=()=>{if(state==='waiting'){clearTimeout(timer);state='early';zone.className='reaction-zone tooearly';zonetxt.textContent='早すぎ！';zonesub.textContent='もう一度いきます';setTimeout(prepare,900)}else if(state==='ready'){let ms=Math.round(performance.now()-start);scores.push(ms);state='done';zonetxt.textContent=ms+' ms';zonesub.textContent='ナイス！';bar.style.width=(n/3*100)+'%';if(n<3){n++;setTimeout(prepare,900)}else setTimeout(showResult,700)}};
function showResult(){game.classList.add('hidden');result.classList.remove('hidden');let a=Math.round(scores.reduce((x,y)=>x+y,0)/scores.length);avg.textContent=a;rank.textContent=a<200?'⚡ 神速！':a<250?'🔥 かなり速い！':a<320?'👍 いい反応！':'🙂 もう一回挑戦！';detail.textContent='3回：'+scores.map(x=>x+'ms').join(' / ')}
function resetAll(){n=1;scores=[];result.classList.add('hidden');intro.classList.remove('hidden')}
if(new URLSearchParams(location.search).get('auto')==='1') countdown();
</script></body></html>
