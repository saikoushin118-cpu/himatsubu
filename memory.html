<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>瞬間記憶チャレンジ｜ヒマツブ</title><meta name="description" content="数秒だけ表示される数字を覚える無料の瞬間記憶ゲーム。約3分で遊べます。"><style>
:root{--bg:#fffaf3;--card:#fff;--ink:#302b28;--muted:#746d67;--accent:#f0b54d;--soft:#f7e4bd;--line:#eee5da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 48px}.brand{text-align:center;font-weight:900;font-size:34px;letter-spacing:.05em}.tag{text-align:center;color:var(--muted);margin:5px 0 30px}
h1,h2,p{margin-top:0}.question{text-align:center;font-size:25px;font-weight:800;margin:20px 0 16px}
.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timebtn,.primary,.choice{border:0;border-radius:18px;background:#fff;box-shadow:0 5px 18px #0000000c;padding:19px;font-weight:800;font-size:18px;color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.timebtn strong{display:block;font-size:28px}.timebtn.active{background:var(--soft)}
.card{background:var(--card);border-radius:22px;padding:20px;margin-top:22px;box-shadow:0 5px 20px #0000000b}.eyebrow{font-size:13px;font-weight:800;color:#a46c18}.primary{display:block;width:100%;background:var(--accent);margin-top:14px}.small{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.back{text-decoration:none;color:var(--ink);font-weight:700}.pill{background:var(--soft);padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}
.center{text-align:center}.big{font-size:46px;font-weight:900;margin:24px 0}.choices{display:grid;gap:10px}.choice{border:2px solid transparent}.choice.correct{border-color:#70b77e;background:#eff9f1}.choice.wrong{border-color:#df7c74;background:#fff0ef}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.reaction-zone{height:330px;border-radius:26px;background:#e9e4dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;user-select:none;cursor:pointer;transition:.15s}.reaction-zone.ready{background:#cce7c8}.reaction-zone.tooearly{background:#f4d0cd}.reaction-zone strong{font-size:30px}
.resultnum{font-size:58px;font-weight:900;margin:15px 0 5px}.hidden{display:none!important}

.memory-number{font-size:52px;font-weight:900;letter-spacing:.12em;word-break:break-all}
.input{width:100%;border:2px solid var(--line);border-radius:16px;padding:16px;font-size:24px;text-align:center;background:#fff}
</style></head><body><main class="wrap">
<div class="top"><a class="back" href="index.html">← ヒマツブ</a><span class="pill">3分ヒマ</span></div>
<section id="intro" class="center"><div class="eyebrow">3分でできる</div><h1>🧠 瞬間記憶チャレンジ</h1><p>数秒だけ表示される数字を覚えよう。<br>全5ラウンド、少しずつ難しくなります。</p><button id="startBtn" class="primary">スタート</button></section>
<section id="game" class="hidden"><div class="progress"><div id="bar" class="bar"></div></div><p class="small center"><span id="round">1</span> / 5</p>
<div id="showCard" class="card center"><p class="small">覚えて！</p><div id="number" class="memory-number"></div><p id="timerText" class="small"></p></div>
<div id="answerCard" class="card center hidden"><p>覚えていた数字を入力</p><input id="answer" class="input" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="覚えた数字"><button id="answerBtn" class="primary">答える</button></div>
<div id="feedback" class="card center hidden"></div><button id="nextBtn" class="primary hidden">次へ →</button></section>
<section id="result" class="center hidden"><div class="eyebrow">RESULT</div><h1>記憶力チャレンジ</h1><div class="resultnum"><span id="score">0</span><small style="font-size:20px"> / 5</small></div><p id="rank"></p><button id="another3" class="primary">もう3分ヒマ？ → 別のゲーム</button><button id="retryBtn" class="primary" style="background:#fff">同じゲームをもう一度</button><a class="primary" style="background:#fff" href="index.html">ホームへ</a></section>
</main><script>
const intro=document.getElementById('intro'),game=document.getElementById('game'),result=document.getElementById('result');
const showCard=document.getElementById('showCard'),answerCard=document.getElementById('answerCard'),feedback=document.getElementById('feedback');
let r=0,points=0,current='',hideTimer=null;
function makeNumber(len){let s='';for(let i=0;i<len;i++)s+=Math.floor(Math.random()*10);return s}
function startGame(){clearTimeout(hideTimer);r=0;points=0;intro.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');showRound()}
function showRound(){current=makeNumber(4+r);round.textContent=r+1;bar.style.width=(r/5*100)+'%';number.textContent=current;timerText.textContent='3秒後に消えます';showCard.classList.remove('hidden');answerCard.classList.add('hidden');feedback.classList.add('hidden');nextBtn.classList.add('hidden');answer.value='';hideTimer=setTimeout(()=>{showCard.classList.add('hidden');answerCard.classList.remove('hidden');answer.focus()},3000)}
function submit(){const val=answer.value.replace(/\D/g,'');if(!val)return;answerCard.classList.add('hidden');feedback.classList.remove('hidden');if(val===current){points++;feedback.innerHTML='<strong>⭕ 正解！</strong><br>'+current}else{feedback.innerHTML='<strong>❌ おしい！</strong><br>正解は '+current}nextBtn.classList.remove('hidden')}
function next(){r++;if(r<5)showRound();else finish()}
function finish(){game.classList.add('hidden');result.classList.remove('hidden');score.textContent=points;rank.textContent=points===5?'🏆 記憶力マスター！':points>=3?'👏 かなりいい記憶力！':'🔥 もう一度挑戦！'}
startBtn.addEventListener('click',startGame);answerBtn.addEventListener('click',submit);answer.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});nextBtn.addEventListener('click',next);retryBtn.addEventListener('click',startGame);
document.getElementById('another3').addEventListener('click',()=>{ location.href='kanji.html?auto=1'; });
if(new URLSearchParams(location.search).get('auto')==='1') startGame();
</script></body></html>
