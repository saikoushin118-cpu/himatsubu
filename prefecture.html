<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>都道府県クイズ｜ヒマツブ</title><meta name="description" content="名物・観光地・県庁所在地から都道府県を当てる無料クイズ。約5分、全10問。"><style>
:root{--bg:#fffaf3;--card:#fff;--ink:#302b28;--muted:#746d67;--accent:#f0b54d;--soft:#f7e4bd;--line:#eee5da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 48px}.brand{text-align:center;font-weight:900;font-size:34px;letter-spacing:.05em}.tag{text-align:center;color:var(--muted);margin:5px 0 30px}
h1,h2,p{margin-top:0}.question{text-align:center;font-size:25px;font-weight:800;margin:20px 0 16px}
.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timebtn,.primary,.choice{border:0;border-radius:18px;background:#fff;box-shadow:0 5px 18px #0000000c;padding:19px;font-weight:800;font-size:18px;color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.timebtn strong{display:block;font-size:28px}.timebtn.active{background:var(--soft)}
.card{background:var(--card);border-radius:22px;padding:20px;margin-top:22px;box-shadow:0 5px 20px #0000000b}.eyebrow{font-size:13px;font-weight:800;color:#a46c18}.primary{display:block;width:100%;background:var(--accent);margin-top:14px}.small{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.back{text-decoration:none;color:var(--ink);font-weight:700}.pill{background:var(--soft);padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}
.center{text-align:center}.big{font-size:46px;font-weight:900;margin:24px 0}.choices{display:grid;gap:10px}.choice{border:2px solid transparent}.choice.correct{border-color:#70b77e;background:#eff9f1}.choice.wrong{border-color:#df7c74;background:#fff0ef}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.reaction-zone{height:330px;border-radius:26px;background:#e9e4dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;user-select:none;cursor:pointer;transition:.15s}.reaction-zone.ready{background:#cce7c8}.reaction-zone.tooearly{background:#f4d0cd}.reaction-zone strong{font-size:30px}
.resultnum{font-size:58px;font-weight:900;margin:15px 0 5px}.hidden{display:none!important}

.clue{font-size:22px;font-weight:800;line-height:1.6} .type{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:800}
</style></head><body><main class="wrap">
<div class="top"><a class="back" href="index.html">← ヒマツブ</a><span class="pill">5分ヒマ</span></div>
<section id="intro" class="center"><div class="eyebrow">5分でできる</div><h1>🗾 都道府県クイズ</h1><p>名物・観光地・県庁所在地などのヒントから<br>都道府県を当てよう。全10問！</p><button id="startBtn" class="primary">スタート</button></section>
<section id="game" class="hidden"><div class="progress"><div id="bar" class="bar"></div></div><p class="small center"><span id="qnum">1</span> / 10</p>
<div class="card center"><span id="type" class="type"></span><div id="clue" class="clue" style="margin-top:15px"></div></div><div id="choices" class="choices" style="margin-top:14px"></div>
<div id="feedback" class="card hidden"></div><button id="nextBtn" class="primary hidden">次へ →</button></section>
<section id="result" class="center hidden"><div class="eyebrow">RESULT</div><h1>都道府県クイズ</h1><div class="resultnum"><span id="score">0</span><small style="font-size:20px"> / 10</small></div><p id="rank"></p>
<button id="retryBtn" class="primary">もう一度</button><a class="primary" style="background:#fff" href="index.html">ホームへ</a></section>
</main><script>
const questions=[
['名物','牛タンとずんだ餅で有名な都道府県は？','宮城県',['宮城県','山形県','岩手県','福島県'],'仙台市を中心に、牛タンやずんだ餅がよく知られています。'],
['観光地','厳島神社がある都道府県は？','広島県',['広島県','岡山県','山口県','島根県'],'厳島神社は広島県廿日市市の宮島にあります。'],
['県庁所在地','県庁所在地が「金沢市」なのは？','石川県',['石川県','富山県','福井県','新潟県'],'金沢市は石川県の県庁所在地です。'],
['名物','讃岐うどんで有名な都道府県は？','香川県',['香川県','徳島県','愛媛県','高知県'],'香川県は讃岐うどんで全国的に有名です。'],
['観光地','日光東照宮がある都道府県は？','栃木県',['栃木県','群馬県','茨城県','埼玉県'],'日光東照宮は栃木県日光市にあります。'],
['県庁所在地','県庁所在地が「那覇市」なのは？','沖縄県',['沖縄県','鹿児島県','宮崎県','長崎県'],'那覇市は沖縄県の県庁所在地です。'],
['名物','きりたんぽで有名な都道府県は？','秋田県',['秋田県','青森県','岩手県','山形県'],'きりたんぽは秋田県の代表的な郷土料理です。'],
['観光地','兼六園がある都道府県は？','石川県',['石川県','福井県','富山県','岐阜県'],'兼六園は石川県金沢市にある日本庭園です。'],
['県庁所在地','県庁所在地が「松山市」なのは？','愛媛県',['愛媛県','香川県','高知県','徳島県'],'松山市は愛媛県の県庁所在地です。'],
['観光地','鳥取砂丘がある都道府県は？','鳥取県',['鳥取県','島根県','岡山県','兵庫県'],'鳥取砂丘は鳥取県を代表する観光地です。'],
['名物','ほうとうで有名な都道府県は？','山梨県',['山梨県','長野県','静岡県','群馬県'],'ほうとうは山梨県の代表的な郷土料理です。'],
['観光地','道後温泉がある都道府県は？','愛媛県',['愛媛県','大分県','兵庫県','熊本県'],'道後温泉は愛媛県松山市にあります。'],
['県庁所在地','県庁所在地が「大津市」なのは？','滋賀県',['滋賀県','京都府','奈良県','三重県'],'大津市は滋賀県の県庁所在地です。'],
['名物','明太子や豚骨ラーメンで知られる都道府県は？','福岡県',['福岡県','熊本県','佐賀県','長崎県'],'福岡県は明太子や豚骨ラーメンなどで知られています。'],
['観光地','出雲大社がある都道府県は？','島根県',['島根県','鳥取県','山口県','広島県'],'出雲大社は島根県出雲市にあります。']
];
let qs=[],i=0,points=0,locked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){qs=shuffle(questions).slice(0,10);i=0;points=0;intro.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');showQ()}
function showQ(){locked=false;feedback.classList.add('hidden');nextBtn.classList.add('hidden');const q=qs[i];qnum.textContent=i+1;bar.style.width=(i/10*100)+'%';type.textContent=q[0];clue.textContent=q[1];choices.innerHTML='';shuffle(q[3]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.addEventListener('click',()=>answer(b,c,q));choices.appendChild(b)})}
function answer(btn,c,q){if(locked)return;locked=true;[...choices.children].forEach(b=>{if(b.textContent===q[2])b.classList.add('correct')});if(c===q[2])points++;else btn.classList.add('wrong');feedback.innerHTML=(c===q[2]?'<strong>⭕ 正解！</strong>':'<strong>❌ 正解は '+q[2]+'</strong>')+'<br>'+q[4];feedback.classList.remove('hidden');nextBtn.classList.remove('hidden')}
function nextQ(){i++;if(i<10)showQ();else finish()}
function finish(){game.classList.add('hidden');result.classList.remove('hidden');score.textContent=points;rank.textContent=points>=9?'🏆 日本マスター！':points>=7?'👏 かなり詳しい！':points>=5?'👍 いい感じ！':'🗾 もう一度日本一周！'}
startBtn.addEventListener('click',startGame);nextBtn.addEventListener('click',nextQ);retryBtn.addEventListener('click',startGame);
if(new URLSearchParams(location.search).get('auto')==='1') startGame();
</script></body></html>
