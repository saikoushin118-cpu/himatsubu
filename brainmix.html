<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10分総合チャレンジ｜ヒマツブ</title><meta name="description" content="漢字・計算・記憶・ひらめきをまとめて楽しむ約10分の無料ミニゲーム。"><style>
:root{--bg:#fffaf3;--card:#fff;--ink:#302b28;--muted:#746d67;--accent:#f0b54d;--soft:#f7e4bd;--line:#eee5da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 48px}.brand{text-align:center;font-weight:900;font-size:34px;letter-spacing:.05em}.tag{text-align:center;color:var(--muted);margin:5px 0 30px}
h1,h2,p{margin-top:0}.question{text-align:center;font-size:25px;font-weight:800;margin:20px 0 16px}
.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.timebtn,.primary,.choice{border:0;border-radius:18px;background:#fff;box-shadow:0 5px 18px #0000000c;padding:19px;font-weight:800;font-size:18px;color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.timebtn strong{display:block;font-size:28px}.timebtn.active{background:var(--soft)}
.card{background:var(--card);border-radius:22px;padding:20px;margin-top:22px;box-shadow:0 5px 20px #0000000b}.eyebrow{font-size:13px;font-weight:800;color:#a46c18}.primary{display:block;width:100%;background:var(--accent);margin-top:14px}.small{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.back{text-decoration:none;color:var(--ink);font-weight:700}.pill{background:var(--soft);padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}
.center{text-align:center}.big{font-size:46px;font-weight:900;margin:24px 0}.choices{display:grid;gap:10px}.choice{border:2px solid transparent}.choice.correct{border-color:#70b77e;background:#eff9f1}.choice.wrong{border-color:#df7c74;background:#fff0ef}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.reaction-zone{height:330px;border-radius:26px;background:#e9e4dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;user-select:none;cursor:pointer;transition:.15s}.reaction-zone.ready{background:#cce7c8}.reaction-zone.tooearly{background:#f4d0cd}.reaction-zone strong{font-size:30px}
.resultnum{font-size:58px;font-weight:900;margin:15px 0 5px}.hidden{display:none!important}

.genre{display:inline-block;padding:6px 11px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:800}
.prompt{font-size:29px;font-weight:900;line-height:1.45;margin:18px 0}
.input{width:100%;border:2px solid var(--line);border-radius:16px;padding:15px;font-size:22px;text-align:center;background:#fff}
</style></head><body><main class="wrap">
<div class="top"><a class="back" href="index.html">← ヒマツブ</a><span class="pill">10分ヒマ</span></div>
<section id="intro" class="center"><div class="eyebrow">10分でじっくり</div><h1>🔥 10分総合チャレンジ</h1><p>漢字・計算・記憶・ひらめき。<br>4ジャンルを連続で遊ぶ全12問！</p><div class="card"><strong>🈶 漢字　➕ 計算<br>🧠 記憶　💡 ひらめき</strong></div><button id="startBtn" class="primary">チャレンジ開始</button></section>
<section id="game" class="hidden"><div class="progress"><div id="bar" class="bar"></div></div><p class="small center"><span id="qnum">1</span> / 12</p>
<div class="card center"><span id="genre" class="genre"></span><div id="prompt" class="prompt"></div><p id="sub" class="small"></p></div>
<div id="choices" class="choices" style="margin-top:14px"></div><div id="inputBox" class="hidden" style="margin-top:14px"><input id="answerInput" class="input" inputmode="numeric" autocomplete="off"><button id="submitBtn" class="primary">答える</button></div>
<div id="feedback" class="card hidden"></div><button id="nextBtn" class="primary hidden">次へ →</button></section>
<section id="result" class="center hidden"><div class="eyebrow">FINAL RESULT</div><h1>総合チャレンジ完了！</h1><div class="resultnum"><span id="score">0</span><small style="font-size:20px"> / 12</small></div><p id="rank"></p><div id="breakdown" class="card"></div>
<button id="retryBtn" class="primary">もう一度挑戦</button><a class="primary" style="background:#fff" href="index.html">ホームへ</a></section>
</main><script>
const normal=[
{g:'🈶 漢字',p:'「躊躇」の読み方は？',a:'ちゅうちょ',c:['ちゅうちょ','ちょうちょ','じゅうちょ','ちゅうしょ'],e:'躊躇（ちゅうちょ）＝ためらうこと。'},
{g:'🈶 漢字',p:'「凡例」の読み方は？',a:'はんれい',c:['はんれい','ぼんれい','はんれつ','ぼんれつ'],e:'凡例（はんれい）＝図表などの記号の説明。'},
{g:'🈶 漢字',p:'「踏襲」の読み方は？',a:'とうしゅう',c:['とうしゅう','ふしゅう','とうしょう','ふとう'],e:'踏襲（とうしゅう）＝以前の方法を受け継ぐこと。'},
{g:'➕ 計算',p:'18 × 7 − 26 = ?',a:'100',c:['90','100','110','116'],e:'18×7=126、126−26=100。'},
{g:'➕ 計算',p:'240 ÷ 6 + 35 = ?',a:'75',c:['65','70','75','80'],e:'240÷6=40、40+35=75。'},
{g:'➕ 計算',p:'15 × 8 + 24 ÷ 6 = ?',a:'124',c:['120','122','124','128'],e:'15×8=120、24÷6=4、合計124。'},
{g:'💡 ひらめき',p:'「春 → 夏 → 秋 → ?」',a:'冬',c:['冬','雨','雪','朝'],e:'四季の順番なので「冬」。'},
{g:'💡 ひらめき',p:'2, 4, 8, 16, ?',a:'32',c:['20','24','30','32'],e:'前の数を2倍しているので32。'},
{g:'💡 ひらめき',p:'1, 4, 9, 16, ?',a:'25',c:['20','24','25','36'],e:'1², 2², 3², 4² と続くので5²=25。'}
];
const memories=[{g:'🧠 記憶',len:5},{g:'🧠 記憶',len:6},{g:'🧠 記憶',len:7}];
let qs=[],i=0,points=0,locked=false,current=null,memTarget='',stats={};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){qs=[...shuffle(normal),...memories].sort(()=>Math.random()-.5);i=0;points=0;stats={'🈶 漢字':[0,0],'➕ 計算':[0,0],'🧠 記憶':[0,0],'💡 ひらめき':[0,0]};intro.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');showQ()}
function resetUI(){locked=false;choices.innerHTML='';choices.classList.remove('hidden');inputBox.classList.add('hidden');feedback.classList.add('hidden');nextBtn.classList.add('hidden');sub.textContent=''}
function showQ(){resetUI();current=qs[i];qnum.textContent=i+1;bar.style.width=(i/12*100)+'%';genre.textContent=current.g;stats[current.g][1]++;if(current.len)showMemory();else showNormal()}
function showNormal(){prompt.textContent=current.p;shuffle(current.c).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.addEventListener('click',()=>answerChoice(b,c));choices.appendChild(b)})}
function answerChoice(btn,c){if(locked)return;locked=true;[...choices.children].forEach(b=>{if(b.textContent===current.a)b.classList.add('correct')});if(c===current.a){points++;stats[current.g][0]++}else btn.classList.add('wrong');feedback.innerHTML=(c===current.a?'<strong>⭕ 正解！</strong>':'<strong>❌ 正解は '+current.a+'</strong>')+'<br>'+current.e;feedback.classList.remove('hidden');nextBtn.classList.remove('hidden')}
function showMemory(){choices.classList.add('hidden');memTarget='';for(let x=0;x<current.len;x++)memTarget+=Math.floor(Math.random()*10);prompt.textContent=memTarget;sub.textContent='3秒で覚えて！';setTimeout(()=>{prompt.textContent='？？？？';sub.textContent='覚えていた数字を入力';inputBox.classList.remove('hidden');answerInput.value='';answerInput.focus()},3000)}
function submitMemory(){if(locked)return;let v=answerInput.value.replace(/\D/g,'');if(!v)return;locked=true;inputBox.classList.add('hidden');if(v===memTarget){points++;stats[current.g][0]++;feedback.innerHTML='<strong>⭕ 正解！</strong><br>'+memTarget}else feedback.innerHTML='<strong>❌ 正解は '+memTarget+'</strong>';feedback.classList.remove('hidden');nextBtn.classList.remove('hidden')}
function nextQ(){i++;if(i<12)showQ();else finish()}
function finish(){game.classList.add('hidden');result.classList.remove('hidden');score.textContent=points;rank.textContent=points>=11?'🏆 ヒマツブ王！':points>=9?'🔥 かなり強い！':points>=6?'👏 ナイスチャレンジ！':'💪 次はもっといける！';breakdown.innerHTML=Object.entries(stats).map(([k,v])=>'<p><strong>'+k+'</strong>　'+v[0]+' / '+v[1]+'</p>').join('')}
startBtn.addEventListener('click',startGame);nextBtn.addEventListener('click',nextQ);submitBtn.addEventListener('click',submitMemory);answerInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitMemory()});retryBtn.addEventListener('click',startGame);
if(new URLSearchParams(location.search).get('auto')==='1') startGame();
</script></body></html>
